#
# Phase 3 of #47 (closes #68).  Linux ASan + UBSan job that builds the
# linux-asan-ubsan-debug preset and runs ctest under sanitizer
# instrumentation.  Catches: heap OOB, use-after-free, double-free,
# signed-integer overflow, alignment violations, unreachable-code UB,
# null-pointer deref through misaligned cast.  Linux runner because
# clang's ASan is well-supported there and the hosted x86_64 image is
# the cheapest place to run a CPU-only sanitizer pass.
#
# Scope intentionally narrower than build.yml's main matrix:
#   - No Vulkan backend (PT_ENABLE_VULKAN_BACKEND=OFF in the preset):
#     the ubuntu-latest hosted runner has no GPU and no usable Vulkan
#     ICD; configuring with Vulkan ON would force the SDK install for
#     a backend that can't run anyway.  ctest stays CPU-only.
#   - No --smoke-frames invocation: same reason -- requires a working
#     backend.  PR #77 explicitly removed smoke-test CI wiring for
#     this exact runner-capability gap.  When a self-hosted runner
#     with a real GPU shows up (or GitHub opens the Tesla-T4 tier to
#     OSS), wire it back in here under the sanitizer env.
#   - There is no CPU backend to fall back to.  The software RHI (and
#     Embree with it) was deleted -- this engine is Windows/Vulkan/
#     NVIDIA-exclusive.  So with Vulkan off this lane compiles and
#     sanitizes HOST code only: pt_core / pt_console / pt_renderer /
#     pt_capture_encoder and the doctest binaries over them.  No RHI
#     backend is compiled at all.
#   - Neither NRD nor DLSS is fetched or built here, and that is
#     enforced by construction rather than by convention.  Both gates in
#     cmake/Dependencies.cmake AND in PT_ENABLE_VULKAN_BACKEND:
#     PT_NRD_ACTIVE needs (PT_ENABLE_NRD AND PT_ENABLE_VULKAN_BACKEND)
#     and the FetchContent_Declare(nrd) sits inside that same block;
#     the DLSS FetchContent_MakeAvailable sits inside
#     (PT_ENABLE_DLSS AND PT_ENABLE_VULKAN_BACKEND AND WIN32).  With the
#     preset's PT_ENABLE_VULKAN_BACKEND=OFF both are false regardless of
#     the ON defaults those two options now carry, so this lane never
#     pays for the NRD source build or the several-hundred-MB DLSS git
#     clone.  Verified by executing cmake/Dependencies.cmake in cmake
#     script mode with the preset's variables: declared deps come back
#     as glm/fmt/mimalloc/glfw/enkits/civetweb/tomlplusplus/vma/
#     nlohmann_json/manifold/doctest, with PT_NRD_ACTIVE=OFF and
#     PT_DLSS_ACTIVE=OFF and neither nrd nor dlss in the list.
#
# What WE do run:
#   - The full ctest suite (harness_smoke, cvar_roundtrip, capture_format,
#     imgdiff_test, plus whatever future tests land under tests/).  Every
#     test executable links pt_console / pt_capture_encoder / etc. which
#     themselves carry the project-wide sanitizer flags, so any UB / OOB
#     in those libraries surfaces here.
#   - No golden-image cells.  pt_add_golden_cell() returns early for a
#     `vulkan` cell when PT_ENABLE_VULKAN_BACKEND is OFF, and every
#     surviving cell in tests/CMakeLists.txt is a vulkan cell now that
#     the software ones are gone, so zero golden tests register on this
#     lane.  That is why the unfiltered `ctest` below is safe.
#
# Triggers: pull_request + push to main, same as build.yml.  No nightly
# schedule needed (the main matrix is already nightly-scheduled; we
# don't gain extra signal from a sanitizer-only nightly).

name: Linux Sanitizers

on:
  push:
    branches: [ main, integration/parallel-batch-1 ]
  pull_request:
    # No base-branch filter: stacked PRs (a PR whose base is another PR
    # branch) must get CI too. `push` stays filtered to avoid building every
    # topic-branch push; nightly-release / the exhaustive sweep are gated on
    # event type below, so PR runs never tag or publish.
  workflow_dispatch:

# Cancel in-flight runs for the same branch when a newer push lands.
# Mirrors the build.yml policy -- a force-push to a PR branch shouldn't
# burn CI minutes finishing the previous run.
concurrency:
  group: linux-sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-asan-ubsan:
    name: Linux (clang + ASan/UBSan)
    runs-on: ubuntu-latest
    # Halt-on-first-diagnostic + always print a stacktrace.  Combined
    # with the preset's -fno-sanitize-recover=all this turns any
    # sanitizer hit into an immediate non-zero exit -- the job fails
    # on the first bug, not after the run has piled up dozens.
    #
    # detect_leaks=1 makes LSan run at process exit (which it does by
    # default on Linux but is explicit here for documentation).
    # detect_stack_use_after_return=1 enables ASan's fake-stack
    # mechanism -- catches the class of bug where a function returns
    # a pointer into its local stack frame and a later caller
    # dereferences the stale pointer.
    env:
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
      ASAN_OPTIONS:  "halt_on_error=1:detect_leaks=1:detect_stack_use_after_return=1:abort_on_error=0:strict_string_checks=1"
      # LSan-only knob: route the suppressions file through the standard
      # LSAN_OPTIONS env var.  A missing path is a fatal LSan startup
      # error on glibc / Linux LSan, so an empty placeholder
      # `.lsan-suppressions.txt` ships at the repo root.  Add narrow
      # `leak:`-prefixed entries there only when a confirmed false
      # positive shows up.
      LSAN_OPTIONS: "suppressions=${{ github.workspace }}/.lsan-suppressions.txt:print_suppressions=0"
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        # ninja-build + clang + cmake drive the configure/build.  GLFW
        # (fetched via Dependencies.cmake) needs X11 + Wayland dev
        # headers + wayland-scanner on Linux because GLFW 3.4's
        # CMakeLists tries to enable both backends and hard-errors if
        # the codegen tool / protocol package is missing.  We never
        # actually open a window on the headless runner -- pt_engine
        # links against libglfw but the tests don't construct one --
        # but a *configure-time* hard error blocks the whole build.
        # `clang` on ubuntu-latest (24.04 as of this commit) is currently
        # clang-18, which has ASan + UBSan parity with mainline LLVM 18.
        # We don't pin a specific clang version because the sanitizer
        # ABI is stable enough that ubuntu's rolling clang works fine.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              ninja-build cmake clang \
              libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
              libwayland-dev wayland-protocols libxkbcommon-dev
          clang --version
          cmake --version
          ninja --version

      - name: Cache Slang toolchain
        # cmake/SetupBinaries.cmake is included UNCONDITIONALLY by the
        # top-level CMakeLists, so this lane downloads the Slang release
        # archive even though it compiles no shaders (PT_ENABLE_VULKAN_BACKEND
        # is OFF, so pt_compile_slang is never invoked).  It lands in
        # third_party/slang/ -- the SOURCE tree, gitignored -- which the
        # build-directory cache below cannot cover.  Caching it is the cheap
        # fix; gating SetupBinaries on the Vulkan backend is the real one and
        # is a source change, not a CI change.
        uses: actions/cache@v4
        with:
          path: third_party/slang
          key: slang-${{ runner.os }}-${{ hashFiles('cmake/SetupBinaries.cmake') }}

      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: build/linux-asan-ubsan-debug
          # Cache bust on the same trigger-set as build.yml -- any
          # CMakeLists / cmake/* change rebuilds.  Sanitizer flag
          # changes flow through cmake/CompilerWarnings.cmake which
          # is in the hash set.
          key: linux-asan-ubsan-${{ hashFiles('CMakeLists.txt', 'cmake/**', '**/CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            linux-asan-ubsan-

      - name: Configure
        # The preset disables Vulkan + OptiX so no SDK install is needed, and
        # -- via the PT_NRD_ACTIVE / PT_DLSS_ACTIVE gates described in the
        # header -- neither of the two heavyweight NVIDIA fetches runs either,
        # despite both PT_ENABLE_NRD and PT_ENABLE_DLSS now defaulting ON.
        # Embree is gone with the software RHI, so this job no longer fetches
        # it -- one fewer dependency and a faster configure. What remains here
        # is exactly what it always really was: a host-code sanitizer run over
        # the CPU-side unit tests.
        #
        # No -DPT_ENABLE_DLSS=OFF is passed on purpose, unlike the Windows
        # lanes. Passing it would imply the gate needs a workaround; it does
        # not, and a redundant flag here would rot the day someone reads it
        # as load-bearing.
        run: cmake --preset linux-asan-ubsan-debug

      - name: Build
        run: cmake --build build/linux-asan-ubsan-debug --parallel

      - name: Unit tests (ctest)
        # --output-on-failure prints the doctest report inline on
        # failure so the CI log shows the exact assertion + file +
        # line without needing an extra artefact download.  Sanitizer
        # diagnostics go to stderr from the test binary which ctest
        # captures here.
        #
        # Per-test timeouts are set in tests/CMakeLists.txt (60 s
        # default, higher for the planetary tests); the sanitizer
        # runtime ~2-5x's wall-clock time.
        #
        # NO label filter, on purpose. build.yml's per-PR step excludes
        # the `nightly` label (pt_planet_terrain_exhaustive, the slow
        # half of the planetary residency sweep) and runs it only on the
        # schedule; this lane has no schedule, so excluding it here would
        # mean the exhaustive sweep NEVER runs under ASan/UBSan -- and it
        # is the only thing that exercises the selector's eviction and
        # paced-stream paths at scale. It fits: the combined test ran in
        # 364 s here before the split, and the exhaustive half now has a
        # 900 s budget of its own. This lane is not the PR bottleneck
        # (the Windows lane is); if it ever becomes one, add
        # `-LE nightly` here and give this workflow a schedule of its own
        # rather than dropping the sanitizer coverage silently.
        run: ctest --test-dir build/linux-asan-ubsan-debug --output-on-failure

      # On failure, upload the ctest log + any test-emitted artefacts
      # (each doctest binary's WORKING_DIRECTORY is its own binary dir
      # under build/) for offline triage.  Sanitizer reports are in the
      # ctest log under "Output:" for the failing test, but we also
      # grab the Testing/Temporary/*.log files ctest writes on every
      # run for completeness.
      - name: Upload ctest artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-sanitizers-ctest-log
          path: |
            build/linux-asan-ubsan-debug/Testing/**
            build/linux-asan-ubsan-debug/tests/**/*.png
            build/linux-asan-ubsan-debug/tests/**/*.log
          if-no-files-found: ignore
          retention-days: 7
